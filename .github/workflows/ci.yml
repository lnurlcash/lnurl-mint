name: CI

on:
  push:
    branches: [main]
  pull_request:

# least-privilege default for every job below - none of them push, publish,
# or otherwise need more than reading the checked-out code
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          python-version: "3.10"

      - name: Install python dependencies
        run: uv sync --locked --dev

      - name: black
        run: make checkblack

      - name: ruff
        run: make checkruff

      - name: mypy
        run: make mypy

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          python-version: "3.10"

      - name: Install python dependencies
        run: uv sync --locked --dev

      # the /docs assets are gitignored, fetched at build time - the docs
      # tests need them present (see scripts/fetch_swagger_ui.py)
      - name: Fetch Swagger UI assets
        run: uv run python scripts/fetch_swagger_ui.py

      - name: pytest
        run: uv run pytest

  # the spark backend's SDK-facing tests (tests/test_spark_backend.py)
  # need the optional breez-sdk-spark native wheel (~20MB) - a separate
  # job rather than the default sync so every other job stays light and
  # the core suite keeps running even if the wheel is unavailable for a
  # platform; the tests importorskip themselves out of the plain `test`
  # job above without it
  spark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          python-version: "3.10"

      - name: Install python dependencies
        run: uv sync --locked --dev --extra spark

      - name: Fetch Swagger UI assets
        run: uv run python scripts/fetch_swagger_ui.py

      - name: pytest (spark)
        run: uv run pytest tests/test_spark.py tests/test_spark_backend.py -v

  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          extra_nix_config: experimental-features = nix-command flakes

      # builds the app and runs the full pytest suite inside the nix
      # sandbox - fails if a python dependency was added or re-pinned in
      # pyproject.toml without updating nix/package.nix (see README, "Nix")
      - name: Build package
        run: nix build .#lnurl-mint --print-build-logs

      # module eval + a NixOS VM smoke test of the module
      - name: Flake check
        run: nix flake check --print-build-logs

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build image
        run: make build
