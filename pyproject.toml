[project]
name = "lnurl-mint"
dynamic = ["version"]
description = "Minimal lnurlcash (LUD-25, Lightning bearer assets) backend."
authors = [{ name = "dni", email = "dni@lnbits.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.11,<0.116.0",
  # uvicorn directly, not fastapi[standard]/fastapi-cli - both pull in
  # fastapi-cloud-cli (a "cloud" CLI feature, plus sentry-sdk as its own
  # dependency), extra supply-chain surface this app never uses. [standard]
  # brings in watchfiles (for --reload, see `make dev`) and httptools/
  # uvloop (faster parsing/event loop).
  "uvicorn[standard]>=0.34.0",
  "bolt11",
  "httpx",
  "pydantic-settings>=2.0,<3.0",
  "qrcode>=8.2",
  "bech32>=1.2.0",
  "coincurve>=20.0.0",
  # NIP-57 zap receipts, one short-lived connection per relay (see nostr.py)
  "websockets>=12.0",
  # LUD-25: every note spend (ck1/cw1) is verified by Bitcoin Core's own
  # interpreter - canonical spend transaction v2, see lnurl_mint/spend.py
  "lnurlcash-kernel>=0.1.0",
]

# the spark funding-source backend (FUNDINGSOURCE_BACKEND=spark, see
# lnurl_mint/spark.py) - kept optional so the default install stays light
# (the wheel is ~20MB of prebuilt native bindings); install with
# `uv sync --extra spark` / `uv pip install '.[spark]'`
[project.optional-dependencies]
spark = ["breez-sdk-spark>=0.23.0,<0.24"]

[dependency-groups]
dev = [
  "pytest>=7.4.0,<8.0.0",
  "black>=24.3.0,<25.0.0",
  "ruff>=0.4.0",
  "mypy>=1.5.1,<2.0.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lnurl_mint"]

[tool.hatch.version]
source = "vcs"

[tool.mypy]
ignore_missing_imports = "True"
files = "lnurl_mint"
plugins = ["pydantic.mypy"]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "I"]
